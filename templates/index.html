<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Tech - Latest Tech Reviews & Best Deals (2026)</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">BG Tech</a>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="#mobiles">Mobiles</a>
            <a href="#laptops">Laptops</a>
            <a href="#headphones">Headphones</a>
        </nav>
    </header>

    <main class="product-container">
        <section style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem; color: var(--text-main);">Latest Tech Reviews & Best Deals</h1>
            <p style="color: var(--text-muted);">Unbiased product reviews, specs breakdown, and best buying links.</p>
        </section>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            {% for product in products %}
            <div style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <img src="{{ product.image }}" alt="{{ product.short_name }}" style="width: 100%; height: 200px; object-fit: contain; border-radius: 8px; margin-bottom: 1rem;">
                    <span style="font-size: 0.8rem; background-color: rgba(0, 102, 255, 0.15); color: var(--primary-color); padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 600;">{{ product.category }}</span>
                    <h2 style="font-size: 1.2rem; margin: 0.5rem 0; line-height: 1.3;">
                        <a href="/products/{{ product.id }}/" style="color: var(--text-main);">{{ product.short_name }}</a>
                    </h2>
                    <p class="rating" style="font-size: 0.9rem;">⭐ {{ product.rating }}</p>
                    <p class="price" style="font-size: 1.4rem; margin-bottom: 1rem;">{{ product.price }}</p>
                </div>
                <a href="/products/{{ product.id }}/" class="buy-btn" style="width: 100%; box-sizing: border-box;">Read Review & Deals</a>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
