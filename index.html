<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Tech - Latest Tech Reviews & Deals</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="./" class="logo">BG Tech</a>
        <nav class="nav-links">
            <a href="./">Home</a>
            <a href="#mobiles">Mobiles</a>
            <a href="#laptops">Laptops</a>
            <button class="theme-toggle-btn" id="themeToggle">🌙 Night</button>
        </nav>
    </header>

    <main class="product-container">
        <section style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">Latest Tech Reviews & Best Deals</h1>
            <p style="color: var(--text-muted);">Unbiased product reviews, specs breakdown, and best buying links.</p>
        </section>

        <div class="product-grid">
            
            <div class="card">
                <div>
                    <img src="https://m.media-amazon.com/images/I/718bfE5jMRL._SX300_.jpg" alt="Samsung Galaxy M34 5G" onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1000&auto=format&fit=crop'">
                    <span class="category-badge">Mobiles</span>
                    <h2 class="card-title">
                        <a href="./products/samsung-galaxy-m34-5g/">Samsung Galaxy M34 5G</a>
                    </h2>
                    <p class="rating">⭐ 4.2 out of 5 stars</p>
                    <p class="price">₹15,999</p>
                </div>
                <a href="./products/samsung-galaxy-m34-5g/" class="buy-btn">Read Review & Deals</a>
            </div>
            
        </div>
    </main>

    <script>
        const btn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        btn.textContent = currentTheme === 'dark' ? '☀️ Day' : '🌙 Night';

        btn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            btn.textContent = newTheme === 'dark' ? '☀️ Day' : '🌙 Night';
        });
    </script>
</body>
</html>
